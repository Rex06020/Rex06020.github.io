<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Transparency Control</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      height: 100vh;
    }

    .image-container {
      position: relative;
      max-width: 90vw;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .image-container .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: opacity 0.2s ease;
      object-fit: contain;
      opacity: 0; /* start transparent */
    }

    .slider-container {
      margin-top: 1rem;
      width: 90%;
      max-width: 400px;
    }

    input[type="range"] {
      width: 100%;
			accent-color: #953539;
    }
  </style>
</head>
<body>
  <div class="image-container" id="imageContainer">
    <img src="105277_0.jpg" alt="Base Image">
    <img src="105276_1.png" alt="Overlay Image" class="overlay" id="overlayImg">
  </div>

  <div class="slider-container" id="sliderContainer">
    <label for="transparency">大哥的怒氣值:</label>
    <input type="range" id="transparency" min="0" max="100" value="0">
  </div>

  <script>
    const slider = document.getElementById('transparency');
    const overlayImg = document.getElementById('overlayImg');
    const imageContainer = document.getElementById('imageContainer');
    const sliderContainer = document.getElementById('sliderContainer');

    // Ensure overlay is transparent after it finishes loading
    overlayImg.addEventListener('load', () => {
      overlayImg.style.opacity = 0;
      slider.value = 0; // sync slider with initial state
    });
		
    // Update overlay transparency
    slider.addEventListener('input', () => {
      const opacityValue = slider.value / 100;
      overlayImg.style.opacity = opacityValue;
    });

    // Adjust image height dynamically
    function adjustImageHeight() {
      const sliderTop = sliderContainer.getBoundingClientRect().top;
      imageContainer.style.maxHeight = sliderTop + 'px';
    }

    window.addEventListener('resize', adjustImageHeight);
    window.addEventListener('load', adjustImageHeight);
  </script>
</body>
</html>
